services:
  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin API listens on 127.0.0.1:2019 inside the container by default and is
      # not published via `ports:` above - not reachable from outside the container, so this
      # is a safe healthcheck target without exposing anything extra.
      # 127.0.0.1, not localhost: "localhost" resolves to ::1 first inside the container,
      # and Caddy's admin API only binds the IPv4 loopback - wget against "localhost" gets
      # "Connection refused" even though the API is up (confirmed 2026-08-08).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
