---
# Linumed Base specific defaults for the `linumed` group.
#
# This file holds plain configuration - values that are fine to read in a code review or
# a backup of this repo. Actual secrets (passwords, keystore passphrases, the BridgeLink
# server ID) live in the sibling vault.yml.example instead - see that file's header for
# the full split and why it matters.

# common_ssh_port: 22
# common_ssh_allow_users: []

# --- Which roles this host runs (issue #86) ---
#
# Leave commented to deploy all seven - see playbooks/site.yml. To deploy a subset, either
# uncomment and edit the list by hand (a misspelled name aborts the run rather than
# silently deploying the full stack anyway), or run scripts/select-roles.sh against this
# file (issue #87) - it understands the one dependency rule (orthanc needs monitoring,
# because orthanc_metrics_enabled defaults to true) and writes the list for you. Either
# way the result has to stay between the two markers below, or a later select-roles.sh
# run duplicates the block instead of replacing it.
# BEGIN linumed_base_roles
# linumed_base_roles:
#   - common
#   - docker
#   - caddy
#   - monitoring
#   - bridgelink
#   # - orthanc      # e.g. omit on a site with no imaging
#   - backup
# END linumed_base_roles

# --- Required, no role default (site.yml aborts without these) ---

# backup role (ansible/roles/backup): any restic-compatible backend - local path, sftp,
# or s3://. Not a secret by itself, but pick a real path/URL before the first run, not
# this placeholder.
backup_repository: "/var/backups/restic"
