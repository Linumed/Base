---
monitoring_deploy_dir: "/opt/linumed-base/monitoring"

# Container images, all pinned (checked 2026-08-10, no "latest" per CONVENTIONS.md).
monitoring_prometheus_image: "prom/prometheus:v3.13.2"
monitoring_grafana_image: "grafana/grafana:13.1.4"
monitoring_loki_image: "grafana/loki:3.7.6"
# Alloy, not Promtail - Promtail reached Node.js-unrelated EOL on 2026-03-02 and gets no
# more security fixes. See ARCHITECTURE.md.
monitoring_alloy_image: "grafana/alloy:v1.18.1"
monitoring_alertmanager_image: "prom/alertmanager:v0.33.1"
monitoring_cadvisor_image: "ghcr.io/google/cadvisor:v0.60.5"

# Only Grafana and Prometheus get a host port, and only on loopback - Loki, Alertmanager,
# and cAdvisor are reached by the other containers via service name inside the stack's own
# Compose network and need no host port at all. Access Grafana via SSH port forwarding:
#   ssh -L 3000:127.0.0.1:3000 <user>@<host>
monitoring_grafana_port: 3000
monitoring_prometheus_port: 9090

# No default admin password - the role's preflight refuses to run without one set
# (same pattern as common_ssh_preflight). Set via Ansible Vault, never committed.
monitoring_grafana_admin_user: "admin"
monitoring_grafana_admin_password: ""

# Grafana phone-home, off - matches CONVENTIONS.md's "no phone-home telemetry" principle.
monitoring_grafana_reporting_enabled: false
monitoring_grafana_check_for_updates: false
# There is deliberately no monitoring_grafana_analytics_enabled: Grafana has no such
# setting. Its [analytics] section holds reporting_enabled, check_for_updates,
# check_for_plugin_updates and feedback_links_enabled - the first two are the variables
# above, the other two are set in the compose template. A variable existed here until
# 2026-08-21 that nothing read (issue #75).

# Local Grafana users beyond the shared admin account (issue #42) - so "who looked at
# this dashboard/these logs" has an answer, and Loki logs (which can carry personal data)
# aren't viewed under one shared identity. Provisioned idempotently via the Grafana HTTP
# API against 127.0.0.1 after the stack is up - Grafana's file-based provisioning
# (provisioning/) covers datasources/dashboards/alerting, not users, there is no
# declarative alternative. `password` must come from Ansible Vault, never committed;
# `role` is one of Viewer/Editor/Admin (Grafana's own org roles). Password is only set at
# creation time - changing an existing user's password here is deliberately not
# supported, see docs/roles/monitoring.md.
# Example:
#   monitoring_grafana_users:
#     - login: "jsmith"
#       name: "Jane Smith"
#       password: "{{ vault_grafana_jsmith_password }}"
#       role: "Viewer"
monitoring_grafana_users: []

# OIDC as a connection point to an institution's EXISTING identity provider (AD, Entra,
# Keycloak, ...) - not a bundled one, see ADR 0003. Empty client_id = off, nothing
# changes. Costs zero extra containers, unlike the Authentik role that was evaluated and
# dropped. Same "refuse a half-configured setup" preflight pattern as the Alertmanager
# SMTP variables above.
monitoring_grafana_oidc_client_id: ""
monitoring_grafana_oidc_client_secret: ""
monitoring_grafana_oidc_auth_url: ""
monitoring_grafana_oidc_token_url: ""
monitoring_grafana_oidc_api_url: ""
monitoring_grafana_oidc_name: "SSO"
# Grafana still needs read access to the userinfo endpoint's scopes to map a name/email -
# "openid email profile" is the common denominator across AD/Entra/Keycloak.
monitoring_grafana_oidc_scopes: "openid email profile"
# Off by default: an OIDC login creating a brand-new local Grafana account for anyone who
# can authenticate against the external IdP is a wider door than provisioning users
# explicitly via monitoring_grafana_users above. Turn on deliberately once the operator's
# IdP membership already gates who should get in.
monitoring_grafana_oidc_allow_sign_up: false

# Retention is split by data kind, not one global value: logs can contain personal data
# (IP addresses, usernames) and get a shorter default than metrics - data minimization,
# not an arbitrary choice. monitoring_retention_days is an escape hatch that, if set,
# overrides both (kept so the single variable name documented in ARCHITECTURE.md's
# earlier draft doesn't point at nothing).
monitoring_metrics_retention_days: 90
monitoring_logs_retention_days: 30
monitoring_retention_days: ~

# Hard size caps in addition to time-based retention - a retention policy alone doesn't
# stop the disk filling if ingestion volume spikes.
monitoring_prometheus_retention_size: "5GB"

# Node Exporter - native Debian package (prometheus-node-exporter), not a container: gets
# security updates via the common role's unattended-upgrades, needs no --pid=host/rootfs
# mounts, and ufw can actually protect its port (a published container port would bypass
# ufw entirely, see common role docs). Prometheus reaches it via
# extra_hosts: host.docker.internal, since a container can't reach 127.0.0.1 on the host.
monitoring_node_exporter_port: 9100
# Debian's own convention for the package - the backup role (#7) can drop a .prom file
# here later without this role needing to change.
monitoring_node_exporter_textfile_dir: "/var/lib/prometheus/node-exporter"
# Denies monitoring_node_exporter_port from every interface except the Docker bridge
# range below, so the intent is explicit and can't be silently widened later by an
# unrelated allow rule.
monitoring_node_exporter_deny_external: true
# The allow rule Prometheus's own scrape needs to get through the deny rule above -
# without it the "node" target is DOWN on every fresh install (issue #40). Covers all of
# Docker's default address-pool range, not one project's specific /16: `docker compose`
# hands out sequential /16s from this pool per project, so the exact subnet depends on
# how many other Compose projects already exist on the host and isn't stable to pin
# narrower.
monitoring_node_exporter_allow_from: "172.16.0.0/12"

# Alloy needs Docker API access for discovery.docker container labels, but never touches
# the raw socket itself (#21) - a docker-socket-proxy sits in between, mounts the socket
# read-only, and only forwards GET /containers* (container list + log streaming), nothing
# else (no exec, no build, no networks, no POST at all). Pinned to a version tag, not
# "latest" or "edge", per CONVENTIONS.md.
monitoring_docker_socket_proxy_image: "tecnativa/docker-socket-proxy:0.3.0"

# Alertmanager delivery (#22). Empty smarthost means "no delivery configured" - the role
# deploys the same receiver-less config as before, alerts stay visible only via the
# Alertmanager API/UI. Set all of smarthost/from/receivers via Ansible Vault to get real
# notifications; the role refuses to deploy a half-configured delivery path (see the
# preflight in tasks/stack.yml) rather than silently dropping alerts.
monitoring_alertmanager_smtp_smarthost: ""
monitoring_alertmanager_smtp_from: ""
monitoring_alertmanager_smtp_auth_username: ""
monitoring_alertmanager_smtp_auth_password: ""
# STARTTLS by default - only relevant once smarthost is set. Turning this off ships alert
# mails (which can contain host/service names) in the clear; only for a smarthost on
# localhost/an already-encrypted tunnel.
monitoring_alertmanager_smtp_require_tls: true
monitoring_alertmanager_receivers: []

# Klinik-Betriebskontext defaults: group_wait keeps the first notification from firing on
# every single alert in a burst (e.g. host down triggers several rules at once),
# repeat_interval of 4h avoids re-paging for a still-open, already-acknowledged alert
# every few minutes without going so long a forgotten alert goes silent for a day.
monitoring_alertmanager_group_wait: "30s"
monitoring_alertmanager_group_interval: "5m"
monitoring_alertmanager_repeat_interval: "4h"

# BridgeLink's application metrics (issue #60). The bridgelink role runs its exporter as a
# sidecar in its own Compose stack, published on loopback, so Prometheus reaches it the
# same way it reaches the node exporter: via host.docker.internal, not by service name -
# the two stacks have separate Compose networks by design.
#
# Off by default and deliberately not derived from "is the bridgelink role in the play":
# a scrape job pointing at a target that was never deployed sits at up == 0 and trips the
# HostDown alert forever. Turn this on together with bridgelink_exporter_enabled.
monitoring_scrape_bridgelink: false

# Docker network Prometheus shares with exporters that live in other Compose stacks.
# A fixed literal name, not Compose's project-derived default, for the same reason as the
# caddy role's linumed-base-external (issue #39): another stack has to reference it as
# `external: true`, so the name must be a stable constant.
#
# Why a shared network and not a published port: a container port published on 127.0.0.1
# is not reachable from another container via host.docker.internal (measured), and
# publishing on all interfaces would bypass ufw entirely - Docker inserts its own rules
# ahead of it. The Node Exporter job gets away with host.docker.internal only because it
# is a *native* systemd service that ufw can actually protect. That pattern does not
# transfer to containers (issue #64).
monitoring_metrics_network_name: "linumed-base-metrics"

# Scrape target for the BridgeLink exporter: a container name on the shared network above,
# so no host port is involved at all. The exporter still publishes 9151 on loopback, but
# that is for a human with curl, not for Prometheus.
monitoring_bridgelink_exporter_target: "linumed-base-bridgelink-exporter:9151"

# Orthanc serves Prometheus metrics natively at /tools/metrics-prometheus - no exporter, the
# opposite of BridgeLink (ADR 0009). The endpoint sits behind Orthanc's own authentication,
# so the scrape needs credentials; supply the same account used in orthanc_users.
# Off by default for the same reason as the BridgeLink job: a scrape target that was never
# deployed sits at up == 0 and trips HostDown forever.
monitoring_scrape_orthanc: false
monitoring_orthanc_target: "linumed-base-orthanc:8042"
monitoring_orthanc_user: ""
monitoring_orthanc_password: ""
