---
# Observability stack for Linumed Base (issues #8, #9). Node Exporter is native (see
# defaults/main.yml); everything else is a Docker Compose stack, added in stack.yml.

- name: Node Exporter (native)
  ansible.builtin.import_tasks: node-exporter.yml

- name: Docker Compose stack
  ansible.builtin.import_tasks: stack.yml

- name: Grafana users
  ansible.builtin.import_tasks: grafana-users.yml
