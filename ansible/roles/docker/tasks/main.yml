---
# Docker Engine + compose plugin from the official Docker apt repo. Consumed by caddy,
# bridgelink, and monitoring, all of which otherwise hit the same
# "docker compose version: command not found" wall (issue #17).

- name: Install prerequisites for adding the Docker apt repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      # community.docker's API-based modules (docker_image, docker_container,
      # docker_container_exec - all used by later roles) import `requests` on the
      # target. On the genericcloud image used by test/vm-test.sh it's present only
      # as a transitive dependency of cloud-init, which masked its absence on a real
      # minimal install (issue #13/#14) until requests was found missing after
      # Docker installed fine and the first community.docker task failed.
      - python3-requests
    state: present
    update_cache: true
  become: true

- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Docker's GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: true
  become: true

# Debian 13 (Trixie) is the target, but Docker's repo can lag a new Debian release for
# weeks/months after it goes stable. Probe before committing to ansible_distribution_release,
# and fall back to docker_apt_release_fallback (bookworm) rather than fail the whole role.
- name: Probe whether Docker's repo has a Release file for this release
  ansible.builtin.uri:
    url: "https://download.docker.com/linux/debian/dists/{{ docker_apt_release }}/Release"
    status_code: [200, 404]
  register: docker_apt_release_probe
  changed_when: false

- name: Set the apt release line to use
  ansible.builtin.set_fact:
    docker_apt_release_effective: >-
      {{ docker_apt_release if docker_apt_release_probe.status == 200 else docker_apt_release_fallback }}

- name: Warn when falling back to an older release line
  ansible.builtin.debug:
    msg: >-
      Docker has no apt repo yet for '{{ docker_apt_release }}' - using
      '{{ docker_apt_release_fallback }}' instead. Revisit docker_apt_release once
      Docker publishes a native Trixie repo.
  when: docker_apt_release_probe.status != 200

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian
      {{ docker_apt_release_effective }} stable
    filename: docker
    state: present
    update_cache: true
  become: true

- name: Install Docker Engine and compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  become: true
  register: docker_package_install

- name: Configure Docker daemon log rotation
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        }
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  become: true
  register: docker_daemon_json

# A plain handler here would only fire at the end of the whole play - after later roles
# (caddy, bridgelink, monitoring) have already started containers via
# docker_compose_v2. Restarting a daemon with live containers under it is slow, so
# restarting inline instead guarantees it happens before anything is running on top of
# Docker. become: true is required here - without it this call runs unprivileged, systemd
# routes it through PolicyKit, and it fails with "Connection timed out" waiting on a
# pkttyagent authorization that never arrives over SSH. See
# ansible/roles/common/README.md ("become: true on every privileged task, no exceptions")
# for the same failure mode hit and fixed earlier in this repo.
- name: Restart docker if the package or daemon config changed
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  become: true
  when: docker_package_install is changed or docker_daemon_json is changed

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  become: true

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  become: true
