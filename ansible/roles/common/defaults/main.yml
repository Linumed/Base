---
# SSH hardening
common_ssh_port: 22
common_ssh_permit_root_login: "no"
common_ssh_password_authentication: "no"
common_ssh_pubkey_authentication: "yes"
common_ssh_kbd_interactive_authentication: "no"
common_ssh_x11_forwarding: "no"
common_ssh_max_auth_tries: 3
common_ssh_login_grace_time: 30
common_ssh_allow_users: []
common_ssh_allow_groups: []

# Set to false only for deliberately root-only setups (e.g. throwaway CI images).
common_ssh_preflight_enabled: true

# ufw firewall
common_ufw_enabled: true
common_ufw_default_incoming: "deny"
common_ufw_default_outgoing: "allow"
# Automatically allows common_ssh_port/tcp. Set to false only if SSH access is handled
# outside ufw entirely (e.g. a host firewall managed elsewhere) - leaving this on and
# forgetting to open the port yourself is how you get locked out.
common_ufw_allow_ssh: true
# Additional ports beyond SSH, e.g.:
#   common_ufw_extra_rules:
#     - port: 443
#       proto: tcp
#       comment: "HTTPS (Caddy)"
common_ufw_extra_rules: []

# fail2ban - SSH brute-force protection
common_fail2ban_enabled: true
# systemd journal, not /var/log/auth.log - avoids a hard dependency on rsyslog being
# installed and configured to write that file.
common_fail2ban_backend: "systemd"
common_fail2ban_maxretry: 5
common_fail2ban_findtime: "10m"
common_fail2ban_bantime: "1h"
common_fail2ban_ignoreip:
  - "127.0.0.1/8"
  - "::1"

# unattended-upgrades - automatic package updates
common_unattended_upgrades_enabled: true
# Security-only by default. Add "${distro_id}:${distro_codename}-updates" for full
# unattended updates, but that pulls in non-security changes unattended too.
common_unattended_upgrades_origins:
  - "${distro_id}:${distro_codename}-security"
# Off by default: an unannounced reboot on healthcare infrastructure is worse than a
# pending kernel update. Enable deliberately per-host if the maintenance window allows it.
common_unattended_upgrades_automatic_reboot: false
common_unattended_upgrades_automatic_reboot_time: "02:00"
common_unattended_upgrades_remove_unused_deps: true
# Empty = no mail report (no MTA is assumed to be configured on a fresh host).
common_unattended_upgrades_mail: ""

# Timezone and NTP
# UTC by default - log timestamps and cross-host correlation stay unambiguous regardless of
# where a given clinic's server physically sits. Override per-inventory if local wall-clock
# time is required (e.g. for staff reading logs directly on the host).
common_timezone: "Etc/UTC"
common_ntp_enabled: true
# Empty = use systemd-timesyncd's compiled-in default (Debian's own NTP pool). Override for
# an on-prem NTP server where internet egress is restricted.
common_ntp_servers: []
common_ntp_fallback_servers: []
