---
- name: SSH hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Ufw firewall
  ansible.builtin.import_tasks: ufw.yml

- name: Fail2ban
  ansible.builtin.import_tasks: fail2ban.yml

- name: Unattended upgrades
  ansible.builtin.import_tasks: unattended-upgrades.yml

- name: NTP and timezone
  ansible.builtin.import_tasks: ntp.yml

# Flush here so common's restarts (ssh, fail2ban, timesyncd) land before later roles
# start anything on top of the system they configure - docker (issue #17) needs its own
# restart to happen, and any Docker Compose stack afterwards (caddy, bridgelink,
# monitoring) needs a running daemon, before common's handlers would otherwise fire at
# the very end of the whole play. Not a workaround for a D-Bus/hardware timing issue -
# that turned out to be a missing `become: true` on the docker role's restart task (see
# its tasks/main.yml and ansible/roles/common/README.md), unrelated to handler ordering.
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
