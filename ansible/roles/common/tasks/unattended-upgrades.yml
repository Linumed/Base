---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
  become: true
  when: common_unattended_upgrades_enabled | bool

- name: Enable periodic APT updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_unattended_upgrades_enabled | bool

- name: Deploy unattended-upgrades configuration
  ansible.builtin.template:
    src: 51-linumed-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/51-linumed-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_unattended_upgrades_enabled | bool

- name: Validate apt config after deploying unattended-upgrades drop-ins
  ansible.builtin.command: apt-config dump
  register: common_apt_config_check
  changed_when: false
  become: true
  when: common_unattended_upgrades_enabled | bool

- name: Fail if apt config is broken
  ansible.builtin.fail:
    msg: "apt-config dump failed after deploying unattended-upgrades drop-ins - check apt.conf.d syntax."
  when:
    - common_unattended_upgrades_enabled | bool
    - common_apt_config_check.rc != 0
