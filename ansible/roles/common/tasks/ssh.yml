---
# Pre-flight: refuse to disable root login if nobody could get back in.
- name: Pre-flight - look for a sudo-capable non-root user with an SSH key
  ansible.builtin.shell: |
    set -o pipefail
    for u in $(getent passwd | awk -F: '$3>=1000 && $3<65534 {print $1}'); do
      home=$(getent passwd "$u" | cut -d: -f6)
      keyfile="$home/.ssh/authorized_keys"
      if [ -s "$keyfile" ] && id -nG "$u" 2>/dev/null | tr ' ' '\n' | grep -qx sudo; then
        echo "$u"
        exit 0
      fi
    done
    exit 1
  args:
    executable: /bin/bash
  register: common_ssh_preflight_user
  changed_when: false
  failed_when: false
  become: true
  when: common_ssh_preflight_enabled | bool and common_ssh_permit_root_login == "no"

- name: Pre-flight - abort if no qualifying user was found
  ansible.builtin.assert:
    that:
      - common_ssh_preflight_user.rc == 0
    fail_msg: >-
      Refusing to disable PermitRootLogin: no non-root user (UID >= 1000) with sudo rights
      and a populated ~/.ssh/authorized_keys was found. Create one first, or set
      common_ssh_preflight_enabled: false if this is a deliberately root-only host.
    success_msg: "Pre-flight OK, found sudo-capable user: {{ common_ssh_preflight_user.stdout }}"
  when: common_ssh_preflight_enabled | bool and common_ssh_permit_root_login == "no"

# Socket guard: with ssh.socket active, sshd ignores its own Port directive - the port comes
# from the socket unit's ListenStream=, which the shipped unit hardcodes to 22. Rather than
# aborting and pointing the operator at a manual edit (the v0.1 behaviour, #15), the role
# templates its own override and reloads the socket unit so common_ssh_port takes effect
# either way.
- name: Socket guard - read ssh.socket unit state
  ansible.builtin.systemd_service:
    name: ssh.socket
  register: common_ssh_socket_status
  changed_when: false
  become: true

- name: Socket guard - determine whether ssh.socket is in use
  ansible.builtin.set_fact:
    common_ssh_socket_in_use: >-
      {{ common_ssh_socket_status.status.ActiveState == 'active' or
         common_ssh_socket_status.status.UnitFileState in ('enabled', 'enabled-runtime') }}

- name: Socket guard - ensure ssh.socket.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: common_ssh_socket_in_use

# Blanks the override away again if common_ssh_port is reverted to 22 - otherwise a stale
# drop-in from an earlier non-default port would survive the revert.
- name: Socket guard - remove ListenStream override when port is the default
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d/listen.conf
    state: absent
  become: true
  register: common_ssh_socket_dropin_removed
  when:
    - common_ssh_socket_in_use
    - common_ssh_port == 22

- name: Socket guard - template ListenStream override
  ansible.builtin.template:
    src: ssh_socket_listen.conf.j2
    dest: /etc/systemd/system/ssh.socket.d/listen.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  register: common_ssh_socket_dropin
  when:
    - common_ssh_socket_in_use
    - common_ssh_port != 22

- name: Socket guard - reload systemd units after a drop-in change
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: >-
    common_ssh_socket_in_use and
    (common_ssh_socket_dropin is changed or common_ssh_socket_dropin_removed is changed)

# With Accept=no (this unit's mode), ssh.service is started eagerly alongside ssh.socket
# and holds the listening fd for as long as it runs - restarting ssh.socket while it's
# still active fails with "Socket service ssh.service already active, refusing." (confirmed
# in an isolated test container). Stopping it first lets the socket restart cleanly;
# ssh.socket starts a fresh ssh.service on the next connection either way.
- name: Socket guard - stop ssh.service before rebinding the socket
  ansible.builtin.systemd_service:
    name: ssh.service
    state: stopped
  become: true
  when: >-
    common_ssh_socket_in_use and
    (common_ssh_socket_dropin is changed or common_ssh_socket_dropin_removed is changed)

- name: Socket guard - restart ssh.socket to bind the new port
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
  become: true
  when: >-
    common_ssh_socket_in_use and
    (common_ssh_socket_dropin is changed or common_ssh_socket_dropin_removed is changed)

# Config is written as a drop-in rather than templating /etc/ssh/sshd_config itself, because
# that file is ucf-managed on Debian - a full-file template would fight ucf on every
# openssh-server upgrade. The 10- prefix matters: sshd uses the first value it finds for each
# keyword, and cloud images ship a 50-cloud-init.conf drop-in that would otherwise win.
- name: Deploy SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-linumed-hardening.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: common_ssh_dropin
  become: true
  notify: Reload ssh

- name: Validate full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  register: common_ssh_validate
  changed_when: false
  failed_when: false
  become: true

- name: Roll back drop-in if validation failed and a previous version existed
  ansible.builtin.copy:
    src: "{{ common_ssh_dropin.backup_file }}"
    dest: /etc/ssh/sshd_config.d/10-linumed-hardening.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - common_ssh_validate.rc != 0
    - common_ssh_dropin.backup_file is defined

- name: Remove drop-in if validation failed and no previous version existed
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-linumed-hardening.conf
    state: absent
  become: true
  when:
    - common_ssh_validate.rc != 0
    - common_ssh_dropin.backup_file is not defined

- name: Fail if sshd configuration is invalid
  ansible.builtin.fail:
    msg: "sshd -t failed after deploying the hardening drop-in: {{ common_ssh_validate.stderr }}"
  when: common_ssh_validate.rc != 0
