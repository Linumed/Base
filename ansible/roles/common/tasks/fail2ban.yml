---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  become: true
  when: common_fail2ban_enabled | bool

# Drop-in under jail.d/, not a template of jail.local - fail2ban itself documents jail.d/
# as the supported place for local overrides, and jail.conf is overwritten on package
# upgrades regardless.
- name: Deploy sshd jail drop-in
  ansible.builtin.template:
    src: jail_sshd.conf.j2
    dest: /etc/fail2ban/jail.d/10-linumed-sshd.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: common_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  become: true
  when: common_fail2ban_enabled | bool

- name: Disable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: false
    state: stopped
  become: true
  when: not (common_fail2ban_enabled | bool)
  failed_when: false
