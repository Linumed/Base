---
# BridgeLink (MPL-2.0 fork of Mirth Connect) plus its PostgreSQL backend, as a Docker
# Compose stack (issue #12). See the role README for the licence background.

# Same preflight pattern as common's SSH role and monitoring's Grafana password: refuse to
# run rather than deploy with empty or guessable credentials.
- name: Preflight - abort if required secrets are unset
  ansible.builtin.assert:
    that:
      - bridgelink_db_password | length > 0
      - bridgelink_keystore_storepass | length > 0
      - bridgelink_keystore_keypass | length > 0
      - bridgelink_server_id | length > 0
    fail_msg: >-
      bridgelink_db_password, bridgelink_keystore_storepass, bridgelink_keystore_keypass
      and bridgelink_server_id must all be set - refusing to deploy with empty
      credentials. Supply them via Ansible Vault. Generate the server ID once with
      `uuidgen` and keep it stable; changing it later makes BridgeLink consider itself a
      different server.

# Separate from the preflight above so the message can say which switch caused it: the
# exporter is opt-in, and being told "set bridgelink_db_password" when the actual problem
# is a missing exporter login would send the operator to the wrong variable.
- name: Preflight - abort if the exporter is enabled without credentials
  ansible.builtin.assert:
    that:
      - bridgelink_exporter_user | length > 0
      - bridgelink_exporter_password | length > 0
    fail_msg: >-
      bridgelink_exporter_enabled is true but bridgelink_exporter_user and/or
      bridgelink_exporter_password are empty. The exporter authenticates against
      BridgeLink's own user database, which this role does not manage - create a
      read-only user in the Administrator first, then supply its credentials via Ansible
      Vault. See docs/roles/bridgelink.md.
  # | bool everywhere this variable is evaluated, including the templates: a value handed
  # in with `-e bridgelink_exporter_enabled=false` arrives as the *string* "false", which
  # Ansible refuses as a conditional and Jinja considers true. Without the filter, asking
  # for the exporter to be off on the command line switches it on (caught by the vm-test
  # pass added in #62).
  when: bridgelink_exporter_enabled | bool

# Same defect as orthanc's, same fix: docker compose config does not resolve external
# networks, so a missing linumed-base-metrics network only surfaces at docker_compose_v2
# as a raw "network declared as external, but could not be found" (issue #86 stage 1).
- name: Check whether the shared metrics network exists
  ansible.builtin.command:
    cmd: docker network inspect {{ bridgelink_exporter_metrics_network }}
  register: bridgelink_metrics_network_check
  changed_when: false
  failed_when: false
  become: true
  when: bridgelink_exporter_enabled | bool

- name: Preflight - abort if the exporter is enabled but the monitoring role never ran
  ansible.builtin.assert:
    that:
      - bridgelink_metrics_network_check.rc == 0
    fail_msg: >-
      bridgelink_exporter_enabled is true, but the {{ bridgelink_exporter_metrics_network }}
      network does not exist on this host. It is created by the monitoring role, not by
      this one - either include monitoring in linumed_base_roles, or set
      bridgelink_exporter_enabled: false if this host deliberately runs without it.
  when: bridgelink_exporter_enabled | bool

- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ bridgelink_deploy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# 0700: the files inside hold the database and keystore passwords in plain text (that is
# how Docker secrets from files work). Nothing but root has any business reading them.
- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ bridgelink_deploy_dir }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

# Owned by the container's UID, not root: Compose bind-mounts a file-based secret into
# the container with the host's ownership intact, and the -dhi image runs as an
# unprivileged 65532 - a root-owned 0600 file makes the bootstrap die with
# AccessDeniedException on /run/secrets/mirth_properties in a restart loop. The
# enclosing secrets/ directory is 0700 root-only, so this is not readable by other
# users on the host either way.
- name: Deploy the mirth.properties secret
  ansible.builtin.template:
    src: mirth.properties.j2
    dest: "{{ bridgelink_deploy_dir }}/secrets/mirth.properties"
    owner: "{{ bridgelink_uid }}"
    group: "{{ bridgelink_gid }}"
    mode: "0400"
  become: true
  no_log: true
  notify: Restart bridgelink

- name: Deploy the database password secret
  ansible.builtin.copy:
    content: "{{ bridgelink_db_password }}"
    dest: "{{ bridgelink_deploy_dir }}/secrets/db_password"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Restart bridgelink

# Owned by the exporter container's UID for the same reason as mirth.properties above -
# a Docker file secret keeps the host's ownership, and the python image runs as a
# non-root user when told to.
- name: Deploy the exporter password secret
  ansible.builtin.copy:
    content: "{{ bridgelink_exporter_password }}"
    dest: "{{ bridgelink_deploy_dir }}/secrets/exporter_password"
    owner: "{{ bridgelink_uid }}"
    group: "{{ bridgelink_gid }}"
    mode: "0400"
  become: true
  no_log: true
  when: bridgelink_exporter_enabled | bool
  notify: Restart bridgelink

- name: Deploy the Prometheus exporter script
  ansible.builtin.copy:
    src: bridgelink_exporter.py
    dest: "{{ bridgelink_deploy_dir }}/bridgelink_exporter.py"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: bridgelink_exporter_enabled | bool
  notify: Restart bridgelink

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bridgelink_deploy_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: bridgelink_compose_file
  become: true

# There is no config linter for mirth.properties, but the Compose file itself can be
# checked before anything is applied - same validate-before-activate idea as the caddy and
# monitoring roles, just with the tool that actually exists here.
- name: Validate the Compose file
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml config --quiet
    chdir: "{{ bridgelink_deploy_dir }}"
  register: bridgelink_compose_validate
  changed_when: false
  failed_when: false
  become: true

- name: Roll back Compose file if validation failed and a previous version existed
  ansible.builtin.copy:
    src: "{{ bridgelink_compose_file.backup_file }}"
    dest: "{{ bridgelink_deploy_dir }}/docker-compose.yml"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - bridgelink_compose_validate.rc != 0
    - bridgelink_compose_file.backup_file is defined

- name: Remove Compose file if validation failed and no previous version existed
  ansible.builtin.file:
    path: "{{ bridgelink_deploy_dir }}/docker-compose.yml"
    state: absent
  become: true
  when:
    - bridgelink_compose_validate.rc != 0
    - bridgelink_compose_file.backup_file is not defined

- name: Fail if the Compose file is invalid
  ansible.builtin.fail:
    msg: "docker compose config failed: {{ bridgelink_compose_validate.stderr }}"
  when: bridgelink_compose_validate.rc != 0

# Pulled explicitly ahead of the apply, for the same reason as in the monitoring role:
# for services without an explicit `command:`, Compose folds the image's own default
# command into the container config-hash, and an image that is not fully local yet at
# first apply produces a different hash than the second run computes - a spurious
# recreate that breaks idempotency.
# Retried, because a failed pull here fails the whole playbook and pull failures are a
# measured, recurring problem on this infrastructure rather than a theoretical one: issue
# #43 was opened after half the full-stack VM runs on 2026-08-14 failed pulling from
# Docker Hub, and a CI run on 2026-08-20 failed with "invalid tar header" while the
# pull-through cache was fetching a freshly bumped Grafana tag for the first time. The
# same pull succeeded immediately afterwards. Three attempts turn that class of failure
# into a slower run instead of a red build; a genuinely missing image still fails.
- name: Pull BridgeLink images ahead of the compose apply
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  become: true
  loop:
    - "{{ bridgelink_image }}"
    - "{{ bridgelink_postgres_image }}"
  register: bridgelink_image_pull
  until: bridgelink_image_pull is succeeded
  retries: 3
  delay: 10

- name: Deploy the BridgeLink stack
  community.docker.docker_compose_v2:
    project_src: "{{ bridgelink_deploy_dir }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
  become: true

# `wait: true` above is NOT sufficient on its own: for a container without a HEALTHCHECK -
# and the hardened image cannot have one, it has no shell - Compose treats "running" as
# ready. A BridgeLink that starts, fails on its config and enters a restart loop is
# reported as a successful deploy (observed exactly that way on 2026-08-10, when the
# secret file was unreadable for UID 65532). So the engine gets asked whether it is
# actually serving, rather than inferring it from container state.
#
# validate_certs: false - BridgeLink generates its own self-signed keystore on first
# start; this is a loopback call to the host's own container, not a trust decision.
# The X-Requested-With header is mandatory: the API rejects requests without it (HTTP
# 400, CSRF protection), which would otherwise look like a broken server.
- name: Verify BridgeLink is actually serving
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ bridgelink_admin_port }}/api/server/version"
    method: GET
    headers:
      X-Requested-With: "ansible-linumed-base"
    validate_certs: false
    return_content: true
  register: bridgelink_version_check
  until: bridgelink_version_check.status == 200
  retries: 30
  delay: 10
  changed_when: false

- name: Report the running BridgeLink version
  ansible.builtin.debug:
    msg: "BridgeLink is serving, version {{ bridgelink_version_check.content | trim }}"
