---
bridgelink_deploy_dir: "/opt/linumed-base/bridgelink"

# BridgeLink, not Mirth Connect: NextGen moved Mirth Connect to a proprietary licence in
# March 2025 (closed source from 4.6 onwards), which collides with this repo's FOSS-only
# rule. BridgeLink is an MPL-2.0 community fork of the last open-source Mirth codebase.
# See the role README for why this fork and not Open Integration Engine.
#
# -dhi-slim: Docker Hardened Image (Amazon Corretto on Debian 13 - same base OS this repo
# targets) with no shell, no package manager, non-root UID 65532, and a Trivy gate on
# fixable HIGH/CRITICAL OS findings in CI. "slim" additionally strips the legacy Swing
# admin client from the image; server and REST API are unaffected, only the Java Web Start
# landing page is gone - Web Start has been dead since JDK 11, admins use the standalone
# Administrator Launcher or WebAdmin instead.
bridgelink_image: "innovarhealthcare/bridgelink:26.6.0-dhi-slim"
bridgelink_postgres_image: "postgres:17.11-alpine"

# The DHI image runs as this UID; any bind-mounted appdata directory has to be owned by it
# or the container cannot write its keystore and server.id.
# INTERNAL, not part of the v1.0 guarantee (ADR 0010): dictated by the image.
bridgelink_uid: 65532
bridgelink_gid: 65532

# Admin/API port. Bound to 127.0.0.1 only - same reasoning as Grafana in the monitoring
# role: a published container port bypasses ufw entirely, so nothing is exposed that does
# not have to be. Access via SSH tunnel:
#   ssh -L 8443:127.0.0.1:8443 <user>@<host>
# Channel listeners (HL7 MLLP, HTTP, ...) are configured per channel inside BridgeLink and
# are NOT published by this role - publishing those is a deliberate, per-deployment
# decision, see docs/roles/bridgelink.md.
bridgelink_admin_port: 8443

# Database. PostgreSQL runs in the same Compose stack and gets no host port at all -
# only BridgeLink talks to it, over the stack's own network.
# INTERNAL, not part of the v1.0 guarantee (ADR 0010): stack-internal, no host port.
bridgelink_db_name: "bridgelink"
bridgelink_db_user: "bridgelink"
# No defaults for any of these - the role's preflight refuses to run unless they are set.
# Supply via Ansible Vault, never in plain text in an inventory that gets committed.
bridgelink_db_password: ""
# Keystore passwords: BridgeLink generates a keystore on first start and needs these to
# unlock it on every subsequent start. Changing them after the first run makes the
# existing keystore unreadable, so set them once and keep them in the vault.
bridgelink_keystore_storepass: ""
bridgelink_keystore_keypass: ""

# server.id, persisted explicitly rather than left to the appdata volume - upstream
# recommends the env var, because it survives a volume being recreated. Generate once
# (uuidgen) and keep it stable for the life of the installation; a changed server ID
# makes BridgeLink treat itself as a different server.
bridgelink_server_id: ""

# JVM max heap in MB, passed through as the first entry of the vmoptions list.
bridgelink_max_heap_mb: 512

# Seconds Docker waits on shutdown before killing the container. Upstream's launcher
# drains queues and DB connections for up to 30s; Docker's default of 10s would cut that
# short, so this is deliberately above it.
bridgelink_stop_grace_period: 35

# --- Prometheus exporter (issue #60) ---------------------------------------------------
# BridgeLink has no /metrics endpoint of its own (verified against 26.6.0-dhi-slim: GET
# /metrics is a 404), so without this sidecar Prometheus only ever sees cAdvisor's
# container-level CPU/RAM for it - numbers that cannot show a stopped channel or a filling
# queue, which are the failure modes that matter for an integration engine.
#
# Off by default, and that is not laziness: the exporter needs a BridgeLink login, and
# BridgeLink's user database belongs to the operator - it is created on first login to the
# Administrator, after this role has run. There is no credential this role could invent.
# Turn it on once a read-only user exists, see docs/roles/bridgelink.md.
bridgelink_exporter_enabled: false

# Pinned upstream image with the exporter script bind-mounted read-only, rather than an
# image built from this repo: the script is standard library only precisely so that no
# image has to be built, scanned and hosted for it. Bind mount of a repo-managed file is
# the documented exception to the "named volumes only" rule in CONVENTIONS.md.
# A full version, not the floating `3.13-alpine`: that tag is a *series* pointer and moves
# to the next patch release without anything in this repository changing, which is not what
# CONVENTIONS.md means by "pinned to a specific version tag". Caught by scripts/scan-images.py
# (issue #67) - with the series tag it could not tell a security patch from a Python version
# jump and proposed 3.14-alpine as an update.
bridgelink_exporter_image: "python:3.13.15-alpine"

# Loopback only, same reasoning as every other port in this repo. This port is for a human
# with curl, NOT the path Prometheus uses: a container port published on 127.0.0.1 is not
# reachable from another container, and publishing it on all interfaces would bypass ufw
# (issue #64). Prometheus reaches the exporter by container name over the shared network
# below.
bridgelink_exporter_port: 9151

# The monitoring role creates this network and Prometheus sits on it; the exporter joins it
# as `external: true`. Must match monitoring_metrics_network_name - it is a fixed literal
# on both sides precisely so two independent Compose projects can agree on it (issue #39's
# pattern, applied again in #64).
#
# Consequence worth knowing: with the exporter enabled, the monitoring role has to have run
# on this host first, or Compose fails on a missing external network. site.yml already
# orders monitoring before bridgelink, and site.yml is the only playbook - but running just
# this role (with a playbook of your own; there are no Ansible tags in this repo) against a
# host that has no monitoring stack does not work with the exporter switched on.
bridgelink_exporter_metrics_network: "linumed-base-metrics"

# A BridgeLink user with read access, NOT the admin account. The exporter only ever issues
# GETs against /api/channels/statuses and /api/system/stats.
bridgelink_exporter_user: ""
# No default - the preflight refuses to enable the exporter without it. Ansible Vault.
bridgelink_exporter_password: ""

# BridgeLink serves its API with the self-signed keystore it generates on first start, and
# this connection never leaves the Compose network. Set to true only if the keystore holds
# a certificate that actually validates.
bridgelink_exporter_verify_tls: false
