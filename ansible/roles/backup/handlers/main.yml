---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# Only the timer, never the service - restarting linumed-base-backup.service would
# interrupt a backup that happens to be running. The timer merely reschedules; restarting
# it just re-reads OnCalendar, it never touches whether a backup is currently in progress.
- name: Restart backup timer
  ansible.builtin.systemd_service:
    name: linumed-base-backup.timer
    state: restarted
  become: true

# Same reasoning as "Restart backup timer" above - restarting only reschedules, it never
# interrupts a restore test that happens to be running.
- name: Restart restore-test timer
  ansible.builtin.systemd_service:
    name: linumed-base-restore-test.timer
    state: restarted
  become: true
