---
caddy_image: "caddy:2.11.4-alpine"
caddy_deploy_dir: "/opt/linumed-base/caddy"
caddy_http_port: 80
caddy_https_port: 443

# ACME account email for Let's Encrypt notifications. Empty is valid (Caddy still gets
# certs), but Let's Encrypt strongly recommends setting one for expiry/revocation notices.
caddy_email: ""

# Reverse-proxied sites. Each entry:
#   domain: the hostname Caddy answers on (ACME auto-TLS is per domain)
#   reverse_proxy: upstream address. Caddy runs as a container, so "127.0.0.1" here means
#     the Caddy container itself, not the Docker host or another container - a common
#     mistake (issue #23). For a service running natively on the host, use
#     "host.docker.internal:PORT" (extra_hosts: host-gateway is already set up by this
#     role). For a service in another Compose stack, use its service name as the
#     hostname and join that stack to caddy_external_network_name below (issue #39) -
#     see docs/roles/caddy.md for a worked example.
#   extra: optional raw Caddyfile lines appended inside the site block (e.g. extra headers)
# Empty by default - an empty Caddyfile with no site blocks is valid but does nothing
# useful, so this must be set per-inventory before the role is worth running.
caddy_sites: []

# A Docker network this role creates and Caddy joins, in addition to its own default
# network - so Caddy can reach a containerized application the operator runs in their
# *own* separate Compose stack, by service name (issue #39). Created unconditionally,
# not opt-in: an unused bridge network costs nothing and exposes nothing on its own
# (network membership isn't a published port, ufw is unaffected either way) - it just
# needs to already exist for an operator's compose file to join as `external: true`
# without an extra manual step. A fixed literal name, not Compose's default
# project-derived one, is the whole point: the name has to be a stable constant another,
# unrelated compose file can reference.
caddy_external_network_name: "linumed-base-external"
