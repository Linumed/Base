---
# The configuration is a bind-mounted secret file, and a content-only change does not alter
# the service definition docker_compose_v2 diffs - so it needs an explicit restart, the same
# pattern as the caddy and monitoring roles. Orthanc has no reload endpoint.
- name: Restart orthanc
  community.docker.docker_container:
    name: linumed-base-orthanc
    state: started
    restart: true
  become: true
