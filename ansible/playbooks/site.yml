# Full stack deployment: common, docker, caddy, monitoring, bridgelink, orthanc, backup
# (#1/#3/#10/#5/#11, #17, #6, #8/#9, #12, #69, #7). orthanc runs after monitoring:
# with metrics enabled it joins a network the monitoring role creates (#64).
- name: Linumed Base - full stack
  hosts: linumed
  roles:
    - common
    - docker
    - caddy
    - monitoring
    - bridgelink
    - orthanc
    - backup
