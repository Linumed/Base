site_name: Linumed Base
site_description: >-
  Ansible-based IaC kit that turns a standard Debian 13 installation into a hardened,
  GDPR-compliant healthcare infrastructure platform.
repo_url: https://github.com/Linumed/Base
repo_name: Linumed/Base
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  # Material's default pulls Roboto from fonts.googleapis.com/fonts.gstatic.com on every
  # page load - an external CDN dependency that contradicts this project's own "no
  # external resources from foreign servers, no tracking" rule (found and fixed while
  # verifying issue #55, before this build is handed to linumed.com for hosting).
  # `false` falls back to the visitor's system font stack, no network request at all.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # Renders ```mermaid fences as diagrams instead of plain code blocks - the same
      # fence syntax GitHub and Forgejo already render natively (confirmed against
      # Forgejo's own markdown API before switching architecture.md's ASCII diagrams).
      #
      # class is deliberately "mermaid-diagram", not Material's own default "mermaid" -
      # see docs/javascripts/mermaid-init.js for why: Material's built-in Mermaid
      # support pulls its renderer from unpkg.com at runtime, an external CDN dependency
      # this project's own rules forbid. This repo vendors mermaid.min.js instead and
      # renders it with a few lines of local JS below.
      custom_fences:
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Roadmap: ROADMAP.md
  # Symlink auf ../CHANGELOG.md, wie architecture.md - keine Inhaltsdopplung, und
  # die Datei bleibt fuer GitHub/Forgejo im Wurzelverzeichnis liegen.
  - Changelog: changelog.md
  - Operations:
      - Deployment: operations/deployment.md
      - Access: operations/access.md
      - Updates: operations/updates.md
      - Backup & Restore: operations/backup-restore.md
      - Troubleshooting: operations/troubleshooting.md
  - Roles:
      - common:
          - SSH hardening: roles/common-ssh.md
          - ufw firewall: roles/common-ufw.md
          - fail2ban: roles/common-fail2ban.md
          - unattended-upgrades: roles/common-unattended-upgrades.md
          - NTP & timezone: roles/common-ntp.md
      - docker: roles/docker.md
      - caddy: roles/caddy.md
      - monitoring: roles/monitoring.md
      - bridgelink: roles/bridgelink.md
      - backup: roles/backup.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - "0001: BridgeLink instead of Mirth Connect": adr/0001-bridgelink-statt-mirth-connect.md
      - "0002: English as the documentation language": adr/0002-english-as-documentation-language.md
      - "0003: Loopback-only access, no bundled identity provider": adr/0003-loopback-only-access-no-bundled-identity-provider.md
      - "0004: VM tests in CI via the host's libvirt socket": adr/0004-vm-tests-in-ci-via-host-libvirt-socket.md
      - "0005: docker/ is a manual-testing reference": adr/0005-docker-directory-is-a-manual-testing-reference-not-a-mirror.md
      - "0006: Linumed Base, not Linumed OS": adr/0006-linumed-base-not-linumed-os.md

# Vendored, not CDN - see docs/javascripts/mermaid-init.js for why. mermaid.min.js must
# load before mermaid-init.js; MkDocs preserves list order in the generated <script> tags.
extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/mermaid.css
