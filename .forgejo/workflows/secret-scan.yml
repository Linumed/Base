name: secret-scan

# Scans the whole git history for secrets with gitleaks (issue #129).
#
# Why this exists: the repository is public and mirrored, and nothing ever looked for
# secrets in it - this workflow and the pre-commit hook (scripts/secret-scan.sh) are the
# first check of any kind. CI is the backstop for a commit made where the hook is not
# installed; the hook is what keeps a secret out of history in the first place, which is
# the only point at which it can still be stopped without a rotation.
#
# Runs on every push and pull request, not on a schedule: the scanner version is pinned,
# so the verdict on unchanged history cannot change, and a weekly rerun would only repeat
# it. Full history (fetch-depth 0) because a secret deleted in a later commit is still
# published.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every `run:` step loads scripts/ci-log.sh through BASH_ENV, which keeps a copy of the
# job's output; on failure, the last step turns it into a Forgejo issue (issue #117).
# ${GITHUB_WORKSPACE} is left for bash to expand when each step starts, see image-scan.yml.
env:
  BASH_ENV: ${GITHUB_WORKSPACE}/scripts/ci-log.sh
  CI_LOG_FILE: /tmp/ci-job.log

jobs:
  secret-scan:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python and curl
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 curl ca-certificates

      # A release binary, not gitleaks-action: the action needs a paid licence for
      # organisation repositories. Pinned together with its checksum, so the binary that
      # runs is the one that was looked at; scripts/secret-scan.sh reads GITLEAKS_VERSION
      # from here and refuses to run against another version. When bumping, take the sum
      # from gitleaks_<version>_checksums.txt of the same release and verify the asset name.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the history
        run: ./scripts/secret-scan.sh --history

      # A red run used to reach nobody (#115, #116). Not for pull requests: a fork's PR
      # gets a read-only token, and its failure belongs in the PR, not the issue tracker.
      - name: "Report a failure as a Forgejo issue (issue #117)"
        if: failure() && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-failure-issue.py
