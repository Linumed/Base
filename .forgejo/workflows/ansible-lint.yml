name: ansible-lint

# Canonical CI (see CONVENTIONS.md): runs on this project's own Forgejo Runner, registered with
# label "docker" only (no "ubuntu-latest" like GitHub) - runs-on must match that label.
# .github/workflows/ansible-lint.yml is the GitHub-side interim copy kept in sync
# manually until the GitHub mirror is retired.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ansible-lint:
    runs-on: docker
    # No custom `container:` - actions/checkout@v4 is a Node action and needs the `node`
    # binary the runner's own label image (node:24-bookworm, bumped 2026-08-10 - node:20
    # reached its Node.js EOL on 2026-04-30) already provides. A python:3.13-slim container
    # has no node, so checkout's post-step fails with "exec: node: executable file not
    # found in $PATH" (confirmed 2026-08-08, task 49).
    steps:
      - uses: actions/checkout@v4

      # node:24-bookworm has no Python - installed here rather than switching container
      # images, to keep node available for actions/checkout.
      # Pinned so a lint rule change upstream can't turn green CI red without a
      # deliberate version bump here.
      - name: Install ansible-lint
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-pip
          pip install --no-cache-dir --break-system-packages ansible-lint==26.6.0

      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

      # Needs no dependencies beyond the python3 installed above - deliberately, so the
      # gate that keeps the v1.0 promise honest cannot be turned off by an install step
      # failing. Runs after the lint because a YAML error should be reported as a YAML
      # error, not as a variable this script cannot parse.
      - name: Every variable is documented or recorded as internal (ADR 0010)
        run: ./scripts/check-variable-docs.py

      # select-roles.sh (issue #87) never touches a host, only the local filesystem - no
      # reason to wait for vm-test.yml's one runner slot for this. Needs python3 (already
      # installed above, for PyYAML's stdlib-free load isn't available, so pip install it)
      # and whiptail for --help/argument parsing, though the tested path is
      # --non-interactive and never opens a dialog.
      - name: scripts/select-roles.sh behaves correctly (issue #87)
        run: |
          apt-get install -y -qq --no-install-recommends whiptail
          pip install --no-cache-dir --break-system-packages pyyaml
          ./test/select-roles-check.sh
