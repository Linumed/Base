name: vm-test

# VM provisioning + idempotency check (issue #33), the second half of the CI target
# picture in CONVENTIONS.md. See ADR 0004 for the reasoning behind running this via the
# runner at all, rather than not, or via a nested libvirtd.
#
# Triggering is a compromise between two real constraints (issue #45):
#   - It has to run by itself. This was dispatch-only until 2026-08-17, and issue #48 is
#     what that cost: a broken docker/caddy reference passed ansible-lint and the
#     role-level VM verification, and surfaced only because the repo happened to get read
#     through a second time by hand. A check that only runs when someone remembers it is
#     not a check.
#   - It can't run on literally every push. A full site.yml double-run against a real VM
#     took ~9 minutes on this hardware (i5-2400, shared with Forgejo, staging and
#     monitoring), and the runner has capacity 1 - every run here blocks ansible-lint
#     behind it for that long.
#
# The paths filter is what reconciles them: this runs when something it can actually
# catch changed, and stays out of the way for documentation-only commits (the most
# frequent kind of push in this repo). workflow_dispatch stays for on-demand runs.
on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'docker/**'
      - 'test/**'
      - 'scripts/**'
      - '.forgejo/workflows/vm-test.yml'
  workflow_dispatch:

jobs:
  vm-test:
    runs-on: docker
    # Overrides the runner label's default image (node:24-bookworm) only to add volume
    # mounts - same image, so actions/checkout@v4 still finds `node` (see
    # ansible-lint.yml's own comment on that requirement).
    #
    # Both mounts are host paths, not container-private ones, and both must be listed in
    # `container.valid_volumes` in the runner's config.yml (ADR 0004):
    #   - the libvirt socket: this job never runs its own libvirtd. It talks to the one
    #     already running on the runner's host over qemu:///system, the same way an operator
    #     testing by hand does.
    #   - the VM work directory: virt-install running in this container tells the HOST's
    #     libvirtd where to put disk images. That only works if the path resolves to the
    #     same files on both sides - a bind mount at an identical path, not a directory
    #     private to this container. TMPDIR below points test/vm-test.sh's own mktemp
    #     call at it.
    container:
      image: node:24-bookworm
      volumes:
        - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
        - /srv/data/ci-vm-workdir:/srv/data/ci-vm-workdir
    env:
      TMPDIR: /srv/data/ci-vm-workdir
    steps:
      # fetch-depth: 0 (full history, all tags) - the default shallow clone has none of
      # the tags run_upgrade_from_previous_tag needs to check out the prior release
      # (test/lib/upgrade-check.sh, issue #89).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Client tools only (libvirt-clients, not libvirt-daemon-system) - this container
      # never starts its own libvirtd, see above. Ansible pinned to match
      # ansible-lint.yml's version, so a lint rule change upstream can't turn this
      # workflow red independently.
      - name: Install libvirt client tools and Ansible
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libvirt-clients virtinst cloud-image-utils qemu-utils osinfo-db-tools python3-pip
          pip install --no-cache-dir --break-system-packages ansible-core ansible-lint==26.6.0

      # node:24-bookworm's own osinfo-db package (0.20221130-2, from Debian bookworm's
      # own repo) predates both "debian12" and "debian13" as osinfo-db entries - Bookworm
      # itself didn't exist yet when that package was frozen. virt-install then fails
      # with "Unknown OS name 'debian12'" (confirmed the first time this workflow ran).
      # osinfo-db-import replaces the database with a real release, independent of the
      # container's own distro version - pinned to match the version already installed
      # on the host (`dpkg -l | grep osinfo-db` there), not `--latest`: that flag computes
      # a URL from today's date that doesn't reliably exist yet (confirmed: 404).
      #
      # Source moved 2026-08-21: this used to fetch from releases.pagure.org, which now
      # 404s for *every* osinfo-db version, not just the pinned one - the project left
      # pagure and publishes release assets on GitLab. The pinned version and the reason
      # for pinning it are unchanged; only the host serving the identical tarball is.
      # The checksum is verified rather than trusted, because a generic-package URL can be
      # overwritten in place - without this, a changed database would silently alter what
      # the VM test provisions, and the run would stay green.
      - name: Update osinfo-db (bookworm's own package predates debian12/13 entries)
        env:
          OSINFO_DB_URL: "https://gitlab.com/api/v4/projects/libosinfo%2Fosinfo-db/packages/generic/release-assets/v20250606/osinfo-db-20250606%2Etar%2Exz"
          OSINFO_DB_SHA256: "9940aa47df298073c51dcf8a4dcc855f494ab864c24cdbda46bd897957357fe1"
        run: |
          curl -fsSL "$OSINFO_DB_URL" -o osinfo-db.tar.xz
          echo "${OSINFO_DB_SHA256}  osinfo-db.tar.xz" | sha256sum -c -
          osinfo-db-import --system osinfo-db.tar.xz
          rm -f osinfo-db.tar.xz

      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Confirm the host's libvirtd is reachable over the mounted socket
        run: |
          export LIBVIRT_DEFAULT_URI="qemu:///system"
          virsh list --all

      - name: Run the full site.yml double-run against a fresh VM
        run: bash test/vm-test.sh
